<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <div class="login-side">
            <div class="grey-bg">
                    <img class="logo" src="images/logo.jpg">
                    <div class="logo-name">KIKI's delivery service</div>
            </div>
        </div>
        <div class="form-side">
            <div class="flex-right">
                <div class="intro-text">
                    Hello! Sign up to join the best delivery service in the world!
                </div>
                <div class="form-content">
                    <div class="form-box">
                        <div class="column1">
                            <p class="form-label">FIRST NAME</p>
                            <input type="text" id="firstName">

                            <p class="form-label">EMAIL</p>
                            <input type="text" id="email">

                            <p class="form-label">PASSWORD</p>
                            <input type="password" id="password">
                        </div>
                        <div class="column2">
                            <p class="form-label">LAST NAME</p>
                            <input type="text" id="lastName">

                            <p class="form-label">PHONE NUMBER</p>
                            <input type="text" id="phoneNumber">

                            <p class="form-label">CONFIRM PASSWORD</p>
                            <input type="password" id="passwordConf">
                        </div>
                    </div>
                </div>
                <div class="send-button">
                    <button class="sendBtn">Create Account</button>
                </div>
                <div class="bottom-text">
                    <a class="common-text">Already have an account? </a> <u class="login-text"> Log in</u>
                </div>
        </div>
    </div>
</body>
</html>
